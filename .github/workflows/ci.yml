name: CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check preinstalled toolchain
        run: |
          gfortran --version
          cmake --version
          python3 --version
          python3 -m pip --version

      - name: Install Cantera reference package
        run: python3 -m pip install --break-system-packages cantera==3.2.0

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPELEF_ENABLE_TESTS=ON
          -DPELEF_ENABLE_CANTERA_REFERENCE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test reactive EB AMR multipatch gate
        run: >-
          ctest --test-dir build
          --tests-regex '^unit_amr_eb_(multipatch|multilevel)_2d$'
          --output-on-failure

      - name: Test reactive EB AMR multipatch application gate
        run: >-
          ctest --test-dir build
          --tests-regex '^(unit_reactive_eb_amr_2d_driver|regression_reactive_eb_amr_(multipatch_2d_(run|check)|multipatch_restart_2d_(reference|checkpoint_stop|restart|check)|physical_boundary_2d_(run|check)|dynamic_physical_boundary_2d_(run|check)|three_level_2d_(reference|run|check)|three_level_restart_2d_(reference|checkpoint_stop|restart|check)|three_level_dynamic_2d_(run|check)|three_level_dynamic_restart_2d_(reference|checkpoint_stop|restart|check)))$'
          --output-on-failure

      - name: Test reactive EB molecular transport gate
        run: >-
          ctest --test-dir build
          --tests-regex '^(unit_reactive_eb_(2d_driver|transport_2d)|regression_reactive_eb_transport_2d_(reference|run|check))$'
          --output-on-failure

      - name: Test
        run: ctest --test-dir build --output-on-failure

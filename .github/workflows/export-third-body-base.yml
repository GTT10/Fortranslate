name: Export third-body base

on:
  push:
    branches:
      - agent/third-body-troe-stiff
    paths:
      - .github/workflows/export-third-body-base.yml
  pull_request:
    branches:
      - agent/elementary-h2o2-cantera
    paths:
      - .github/workflows/export-third-body-base.yml

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Create source archive
        shell: bash
        run: tar --exclude=.git -czf /tmp/third-body-base.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: third-body-base
          path: /tmp/third-body-base.tar.gz
          retention-days: 1

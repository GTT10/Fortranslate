name: Build non-replicated MPI multispecies hydro

on:
  push:
    branches:
      - agent/tmp-build-mpi-multispecies-hydro

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Start from verified MPI foundation
        shell: bash
        run: |
          git fetch origin agent/mpi-1d-foundation agent/tmp-build-mpi-multispecies-hydro
          git switch --force-create work origin/agent/mpi-1d-foundation
          test -f docs/validation/0.19-remote-ci-complete.txt
          test -f docs/validation/0.20-mpi-foundation-complete.txt
          grep -q 'VERSION 0.20.0' CMakeLists.txt
          git show origin/agent/tmp-build-mpi-multispecies-hydro:tools/build_mpi_multispecies_hydro.py > /tmp/build_mpi_multispecies.py
      - name: Add non-replicated ten-species MPI hydro
        run: python3 /tmp/build_mpi_multispecies.py
      - name: Install OpenMPI
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev
      - name: Release build and serial regressions
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DPELEF_ENABLE_TESTS=ON -DPELEF_ENABLE_MPI=ON
          cmake --build build-release --parallel 2
          ctest --test-dir build-release --output-on-failure -j 2
      - name: Release 1/2/4-rank parity
        run: |
          mpiexec -n 1 ./build-release/pelef_mpi_multispecies_1d release_np1.csv
          mpiexec -n 2 ./build-release/pelef_mpi_multispecies_1d release_np2.csv
          mpiexec -n 4 ./build-release/pelef_mpi_multispecies_1d release_np4.csv
          python3 tools/compare_mpi_multispecies.py release_np1.csv release_np2.csv release_np4.csv
      - name: Debug build and 1/2/4-rank parity
        run: |
          cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug -DPELEF_ENABLE_TESTS=ON -DPELEF_ENABLE_MPI=ON
          cmake --build build-debug --parallel 2
          ctest --test-dir build-debug --output-on-failure -j 2
          mpiexec -n 1 ./build-debug/pelef_mpi_multispecies_1d debug_np1.csv
          mpiexec -n 2 ./build-debug/pelef_mpi_multispecies_1d debug_np2.csv
          mpiexec -n 4 ./build-debug/pelef_mpi_multispecies_1d debug_np4.csv
          python3 tools/compare_mpi_multispecies.py debug_np1.csv debug_np2.csv debug_np4.csv
      - name: Publish verified milestone
        run: |
          rm -rf build-release build-debug *.csv
          git add -- CMakeLists.txt app cases docs src tools
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git commit -m "Add non-replicated MPI multispecies hydro"
          git push origin HEAD:agent/mpi-multispecies-hydro

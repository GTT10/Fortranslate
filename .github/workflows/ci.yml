name: CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: serial-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record source identity
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          git archive --format=tar.gz HEAD > evidence/source.tar.gz
          gfortran --version > evidence/fortran-version.txt
          cmake --version > evidence/cmake-version.txt

      - name: Check preinstalled toolchain
        run: |
          gfortran --version
          cmake --version
          python3 --version
          python3 -m pip --version

      - name: Install Cantera reference package
        run: |
          python3 -m pip install --break-system-packages cantera==3.2.0
          python3 -m pip freeze > evidence/python-packages.txt

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPELEF_ENABLE_TESTS=ON
          -DPELEF_ENABLE_CANTERA_REFERENCE=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test reactive EB AMR core gate
        run: >-
          ctest --test-dir build
          --tests-regex '^unit_amr_eb_(reactive|multipatch|multilevel)_2d$'
          --output-on-failure

      - name: Test reactive EB AMR multipatch application gate
        run: >-
          ctest --test-dir build
          --tests-regex '^(unit_reactive_eb_amr_2d_driver|regression_reactive_eb_amr_(multipatch_2d_(run|check)|multipatch_restart_2d_(reference|checkpoint_stop|restart|check)|physical_boundary_2d_(run|check)|dynamic_physical_boundary_2d_(run|check)|three_level_2d_(reference|run|check)|three_level_restart_2d_(reference|checkpoint_stop|restart|check)|three_level_dynamic_2d_(run|check)|three_level_dynamic_restart_2d_(reference|checkpoint_stop|restart|check)))$'
          --output-on-failure

      - name: Test reactive EB and AMR molecular transport gate
        run: >-
          ctest --test-dir build
          --tests-regex '^(unit_(reactive_eb_(2d_driver|transport_2d)|amr_eb_(transport_2d|multilevel_transport_2d|multipatch_2d))|regression_reactive_eb_(transport_2d|amr_transport_2d|amr_three_level_transport_2d|amr_multipatch_transport_2d)_(reference|run|check))$'
          --output-on-failure

      - name: Test
        run: >-
          ctest --test-dir build --output-on-failure --parallel 2
          --output-junit ${{ github.workspace }}/evidence/ctest-results.xml

      - name: Preserve serial validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-${{ matrix.build_type }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            build/CMakeCache.txt
            build/Testing/Temporary/LastTest.log
          retention-days: 30

description: |-
  Seven-species, four-reaction elementary H2/O2 mechanism used only for
  PeleF production-rate and constant-volume reactor parity tests.
  Thermodynamics and selected forward rates originate from Cantera h2o2.yaml.

units: {length: m, time: s, quantity: kmol, activation-energy: J/kmol}


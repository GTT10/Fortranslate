name: Apply verified PeleF 0.19.0 full H2O2 CFD

on:
  push:
    branches:
      - agent/tmp-publish-full-h2o2-actual-019

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out payload branch
        uses: actions/checkout@v4
        with:
          ref: agent/tmp-publish-full-h2o2-actual-019
          fetch-depth: 0

      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          expected_gzip="0873a58397c76ba786af54f5b87f3319b040648d4b4607f14a5196c04830756e"
          expected_patch="48ee632ce5998098d0d228615c013c8682366cad92ed38930472040e0281238f"

          # part01 may contain either one or two 8-kB chunks depending on the
          # connector's accepted payload size. Try both exact orderings and
          # accept only the one matching the pinned gzip digest.
          cat tools/pelef019.part00 tools/pelef019.part01 \
              tools/pelef019.part03 tools/pelef019.part04 \
              | base64 --decode > /tmp/candidate-a.patch.gz || true
          cat tools/pelef019.part00 tools/pelef019.part01 \
              tools/pelef019.part02 tools/pelef019.part03 tools/pelef019.part04 \
              | base64 --decode > /tmp/candidate-b.patch.gz || true

          if echo "${expected_gzip}  /tmp/candidate-a.patch.gz" | sha256sum -c -; then
            cp /tmp/candidate-a.patch.gz /tmp/pelef019.patch.gz
          elif echo "${expected_gzip}  /tmp/candidate-b.patch.gz" | sha256sum -c -; then
            cp /tmp/candidate-b.patch.gz /tmp/pelef019.patch.gz
          else
            echo "No payload ordering matched the pinned gzip digest" >&2
            exit 1
          fi

          gzip -dc /tmp/pelef019.patch.gz > /tmp/pelef019.patch
          echo "${expected_patch}  /tmp/pelef019.patch" | sha256sum -c -

      - name: Apply verified tree and publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/reactive-full-h2o2-cfd
          git switch --force-create agent/reactive-full-h2o2-cfd \
            origin/agent/reactive-full-h2o2-cfd
          test "$(git rev-parse HEAD)" = \
            "e06289a500660d3aed79c5ba810a3eb40055382d"

          git config user.name "Toshiki Kakeya"
          git config user.email "pqg693x1@s.okayama-u.ac.jp"
          git apply --index /tmp/pelef019.patch
          test "$(git write-tree)" = \
            "b1e5c36318f94bd6a38a13b79c42a3f3ab0f1af4"
          git commit -m "Add full pressure-dependent H2O2 chemistry to CFD"
          test "$(git rev-parse HEAD^{tree})" = \
            "b1e5c36318f94bd6a38a13b79c42a3f3ab0f1af4"
          git push origin HEAD:agent/reactive-full-h2o2-cfd

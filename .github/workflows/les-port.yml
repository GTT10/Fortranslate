name: LES port
on:
  push:
    branches: [feature/pelec-les-port]
  pull_request:
    paths:
      - 'src/les/**'
      - 'tests/*les*'
      - 'tools/*les*'
      - '.github/workflows/les-port.yml'
permissions:
  contents: read
jobs:
  upstream-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Pele-Suite/PeleC
          ref: bf0e1fd15040f0f5609cd9042b9f1b868e0e95f8
          path: upstream
          persist-credentials: false
      - name: Record exact reference
        run: |
          mkdir evidence
          git -C upstream rev-parse HEAD > evidence/commit.txt
          git -C upstream rev-parse HEAD^{tree} > evidence/tree.txt
          git -C upstream archive --format=tar.gz HEAD > evidence/pelec.tar.gz
          sha256sum upstream/Source/LES.H upstream/Source/LES.cpp > evidence/les-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pelec-les-reference
          path: evidence/
          retention-days: 30
          if-no-files-found: error

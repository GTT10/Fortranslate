name: Apply reactive 2D CTU implementation

on:
  push:
    branches:
      - agent/tmp-publish-reactive-2d-ctu
  pull_request:
    branches:
      - agent/reactive-characteristic-ppm

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out payload branch
        uses: actions/checkout@v4
        with:
          ref: agent/tmp-publish-reactive-2d-ctu
          fetch-depth: 0

      - name: Decode and verify patch
        shell: bash
        run: |
          cat tools/reactive2d.part00 \
              tools/reactive2d.part01 \
              tools/reactive2d.part02 \
              tools/reactive2d.part03 \
              tools/reactive2d.part04 \
            | base64 --decode > /tmp/reactive2d.patch.gz
          echo "56f6cbc471bfb35a43a6c6e2986ecbbf2b4a4693267e819172c6e9276defcf76  /tmp/reactive2d.patch.gz" \
            | sha256sum --check --strict
          gzip -dc /tmp/reactive2d.patch.gz > /tmp/reactive2d.patch

      - name: Apply and publish implementation
        shell: bash
        run: |
          git fetch origin agent/reactive-general-eos-2d-ctu
          git switch --force-create agent/reactive-general-eos-2d-ctu \
            origin/agent/reactive-general-eos-2d-ctu
          git config user.name "Toshiki Kakeya"
          git config user.email "pqg693x1@s.okayama-u.ac.jp"
          git am /tmp/reactive2d.patch
          git push origin HEAD:agent/reactive-general-eos-2d-ctu

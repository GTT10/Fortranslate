name: Export current third-body source

on:
  push:
    branches:
      - agent/tmp-export-third-body-current
  pull_request:
    branches:
      - agent/third-body-troe-stiff

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: agent/third-body-troe-stiff
          fetch-depth: 0

      - name: Package source
        shell: bash
        run: |
          git archive --format=tar.gz \
            --output=/tmp/fortranslate-third-body-current.tar.gz \
            agent/third-body-troe-stiff
          git rev-parse HEAD > /tmp/fortranslate-third-body-current.commit
          git rev-parse HEAD^{tree} > /tmp/fortranslate-third-body-current.tree
          sha256sum /tmp/fortranslate-third-body-current.tar.gz \
            > /tmp/fortranslate-third-body-current.sha256

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: fortranslate-third-body-current
          path: |
            /tmp/fortranslate-third-body-current.tar.gz
            /tmp/fortranslate-third-body-current.commit
            /tmp/fortranslate-third-body-current.tree
            /tmp/fortranslate-third-body-current.sha256
          compression-level: 0
          retention-days: 1

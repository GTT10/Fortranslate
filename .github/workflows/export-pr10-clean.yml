name: Export PR10 clean source

on:
  pull_request:
    branches:
      - agent/nasa7-mixture-thermo
    paths:
      - .github/workflows/export-pr10-clean.yml

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: tar --exclude=.git -czf /tmp/pr10-clean.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: pr10-clean-source
          path: /tmp/pr10-clean.tar.gz
          retention-days: 1

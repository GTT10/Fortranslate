name: Export source snapshot

on:
  push:
    branches:
      - agent/tmp-export-2d

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Pack source tree
        shell: bash
        run: |
          tar --exclude=.git --exclude=build -czf /tmp/fortranslate-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: fortranslate-source
          path: /tmp/fortranslate-source.tar.gz
          if-no-files-found: error
          retention-days: 1

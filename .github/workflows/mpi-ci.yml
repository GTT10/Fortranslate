name: MPI CI

on:
  push:
    branches:
      - main
      - "agent/mpi-*"
  pull_request:
    branches:
      - main
      - agent/reactive-full-h2o2-cfd
      - "agent/mpi-*"

permissions:
  contents: read

jobs:
  mpi-build-and-test:
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenMPI
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev
      - name: Configure
        run: >-
          cmake -S . -B build-mpi
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_Fortran_COMPILER=/usr/bin/gfortran
          -DMPI_Fortran_COMPILER=/usr/bin/mpifort
          -DMPIEXEC_EXECUTABLE=/usr/bin/mpiexec
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install-mpi
          -DPELEF_ENABLE_TESTS=ON
          -DPELEF_ENABLE_MPI=ON
          -DPELEF_MECHANISM_BUNDLE=mechanisms/h2o2_full.json
          -DPELEF_MECHANISM_SOURCE=mechanisms/h2o2_cantera.yaml
      - name: Build
        run: cmake --build build-mpi --parallel 2
      - name: Install and audit MPI artifacts
        run: |
          cmake --install build-mpi
          test "$(find install-mpi/bin -maxdepth 1 -type f -executable | wc -l)" -eq 40
          for installed in install-mpi/bin/*; do
            name=${installed##*/}
            cmp "build-mpi/$name" "$installed"
          done
          python3 tools/check_no_executable_stack.py install-mpi/bin/*
          if readelf -d install-mpi/bin/pelef_mpi_reactive_1d_selected | grep -Eq 'RPATH|RUNPATH'; then
            echo "selected MPI install contains RPATH/RUNPATH"
            exit 1
          fi
          cmake -DPELEF_MPI_EXECUTABLE=${{ github.workspace }}/install-mpi/bin/pelef_mpi_reactive_1d_selected -P cmake/CheckMpiRuntimeDependencies.cmake
          mkdir installed-eb-amr-smoke
          (
            cd installed-eb-amr-smoke
            ../install-mpi/bin/pelef_reactive_eb_amr_2d ../cases/selected_reactive_eb_amr_2d/h2o2_full_fixed.nml
            ../install-mpi/bin/pelef_reactive_eb_amr_2d_selected ../cases/selected_reactive_eb_amr_2d/h2o2_full_selected.nml
            cmp full_h2o2_reactive_eb_amr_2d_coarse.csv selected_full_h2o2_reactive_eb_amr_2d_coarse.csv
            cmp full_h2o2_reactive_eb_amr_2d_fine.csv selected_full_h2o2_reactive_eb_amr_2d_fine.csv
          )
          mkdir installed-eb3d-smoke
          (
            cd installed-eb3d-smoke
            ../install-mpi/bin/pelef_reactive_eb_3d_selected \
              ../cases/selected_reactive_eb_3d/h2o2_full_transport_chemistry.nml
            python3 ../tools/check_selected_reactive_eb_3d.py \
              --input selected_full_reactive_eb_3d_transport_chemistry.csv \
              --species H2 H O O2 OH H2O HO2 H2O2 AR N2 \
              --nx 10 --ny 8 --nz 6 --final-time 2.0e-9 \
              --x-upper 1.0e-4 --y-upper 1.0e-4 --z-upper 1.0e-4 \
              --plane-axis x --plane-position 3.95e-5 \
              --expected-regular 288 --expected-cut 48 \
              --expected-covered 144 --activity-species H2 \
              --initial-mass-fraction 0.028502723329253223 \
              --minimum-change 1.0e-9 \
              --minimum-active-density-span 2.0e-2
          )
          mkdir installed-mpi-eb-tree-smoke
          (
            cd installed-mpi-eb-tree-smoke
            /usr/bin/mpiexec --oversubscribe -n 1 \
              ../install-mpi/bin/pelef_mpi_reactive_eb_patch_tree_2d \
              ../cases/selected_mpi_reactive_eb_patch_tree_2d/h2o2_full_fixed.nml \
              installed_fixed.csv
            for ranks in 1 2 4; do
              /usr/bin/mpiexec --oversubscribe -n "$ranks" \
                ../install-mpi/bin/pelef_mpi_reactive_eb_patch_tree_2d_selected \
                ../cases/selected_mpi_reactive_eb_patch_tree_2d/h2o2_full_selected.nml \
                "installed_selected_np${ranks}.csv"
            done
            python3 ../tools/check_selected_mpi_reactive_eb_patch_tree_2d.py \
              --reference installed_fixed.csv \
              --candidate installed_selected_np1.csv \
              --candidate installed_selected_np2.csv \
              --candidate installed_selected_np4.csv \
              --species H2 H O O2 OH H2O HO2 H2O2 AR N2 \
              --expected-levels 0 1 2 3 --final-time 1.0e-12
            /usr/bin/mpiexec --oversubscribe -n 1 \
              ../install-mpi/bin/pelef_mpi_reactive_eb_patch_tree_2d \
              ../cases/selected_mpi_reactive_eb_patch_tree_2d/restart_fixed_reference.nml \
              restart_fixed_np1.csv
            for ranks in 1 2 4; do
              /usr/bin/mpiexec --oversubscribe -n "$ranks" \
                ../install-mpi/bin/pelef_mpi_reactive_eb_patch_tree_2d_selected \
                ../cases/selected_mpi_reactive_eb_patch_tree_2d/restart_selected_reference.nml \
                "restart_selected_np${ranks}.csv"
            done
            /usr/bin/mpiexec --oversubscribe -n 1 \
              ../install-mpi/bin/pelef_mpi_reactive_eb_patch_tree_2d_selected \
              ../cases/selected_mpi_reactive_eb_patch_tree_2d/restart_checkpoint_stop.nml
            for ranks in 2 4; do
              /usr/bin/mpiexec --oversubscribe -n "$ranks" \
                ../install-mpi/bin/pelef_mpi_reactive_eb_patch_tree_2d_selected \
                ../cases/selected_mpi_reactive_eb_patch_tree_2d/restart_restart.nml \
                "restarted_np${ranks}.csv"
            done
            python3 ../tools/check_selected_mpi_reactive_eb_patch_tree_2d_restart.py \
              --checkpoint selected_mpi_eb_restart.chk \
              --reference restart_fixed_np1.csv \
              --candidate restart_selected_np1.csv \
              --candidate restart_selected_np2.csv \
              --candidate restart_selected_np4.csv \
              --candidate restarted_np2.csv \
              --candidate restarted_np4.csv \
              --stopped selected_mpi_eb_restart_stopped.csv \
              --species H2 H O O2 OH H2O HO2 H2O2 AR N2 \
              --expected-levels 0 1 2 3 --final-time 1.0e-12 \
              --bundle-sha256 f65e1c02e77618d188bc95f0868f3749d6345afb355fda924297521f69ce04c3 \
              --integrator implicit \
              --composition 0.29570 1.0e-5 1.0e-5 0.14784 1.0e-5 0.0 0.0 0.0 0.0 0.55643
            python3 ../tools/check_selected_mpi_reactive_eb_patch_tree_2d_restart_failures.py \
              --launcher /usr/bin/mpiexec --numproc-flag=-n --ranks 1 \
              --executable \
                "${{ github.workspace }}/install-mpi/bin/pelef_mpi_reactive_eb_patch_tree_2d_selected" \
              --input \
                ../cases/selected_mpi_reactive_eb_patch_tree_2d/restart_restart.nml \
              --checkpoint selected_mpi_eb_restart.chk \
              --work-directory invalid-corruptions
            python3 ../tools/check_selected_mpi_reactive_eb_patch_tree_2d_aliases.py \
              --launcher /usr/bin/mpiexec --numproc-flag=-n --ranks 1 \
              --executable \
                "${{ github.workspace }}/install-mpi/bin/pelef_mpi_reactive_eb_patch_tree_2d_selected" \
              --reference-input \
                ../cases/selected_mpi_reactive_eb_patch_tree_2d/restart_selected_reference.nml \
              --checkpoint-input \
                ../cases/selected_mpi_reactive_eb_patch_tree_2d/restart_checkpoint_stop.nml \
              --restart-input \
                ../cases/selected_mpi_reactive_eb_patch_tree_2d/restart_restart.nml \
              --work-directory invalid-aliases
          )
          for ranks in 1 2 4; do
            /usr/bin/mpiexec --oversubscribe -n "$ranks" install-mpi/bin/pelef_mpi_reactive_1d "installed_fixed_np${ranks}.csv"
            /usr/bin/mpiexec --oversubscribe -n "$ranks" install-mpi/bin/pelef_mpi_reactive_1d_selected "installed_selected_np${ranks}.csv"
          done
          python3 tools/compare_mpi_reactive_1d.py installed_fixed_np1.csv installed_fixed_np2.csv installed_fixed_np4.csv installed_selected_np1.csv installed_selected_np2.csv installed_selected_np4.csv
      - name: Halo exchange gates
        run: |
          mpiexec --oversubscribe -n 1 ./build-mpi/pelef_mpi_1d --halo-test
          mpiexec --oversubscribe -n 2 ./build-mpi/pelef_mpi_1d --halo-test
          mpiexec --oversubscribe -n 4 ./build-mpi/pelef_mpi_1d --halo-test
          mpiexec --oversubscribe -n 8 ./build-mpi/pelef_mpi_1d --halo-test
      - name: AMR owner chemistry, hydro, and transport gates
        run: |
          mpiexec --oversubscribe -n 1 ./build-mpi/pelef_mpi_amr_patch_1d
          mpiexec --oversubscribe -n 2 ./build-mpi/pelef_mpi_amr_patch_1d
          mpiexec --oversubscribe -n 4 ./build-mpi/pelef_mpi_amr_patch_1d
          mpiexec --oversubscribe -n 8 ./build-mpi/pelef_mpi_amr_patch_1d
      - name: EB AMR 2D replicated and sparse owner full-physics gates
        run: |
          mpiexec --oversubscribe -n 1 ./build-mpi/pelef_mpi_eb_amr_patch_2d
          mpiexec --oversubscribe -n 2 ./build-mpi/pelef_mpi_eb_amr_patch_2d
          mpiexec --oversubscribe -n 4 ./build-mpi/pelef_mpi_eb_amr_patch_2d
          mpiexec --oversubscribe -n 8 ./build-mpi/pelef_mpi_eb_amr_patch_2d
      - name: Arbitrary-depth EB patch-tree ownership gates
        run: |
          mpiexec --oversubscribe -n 1 ./build-mpi/pelef_mpi_amr_eb_patch_tree_2d
          mpiexec --oversubscribe -n 2 ./build-mpi/pelef_mpi_amr_eb_patch_tree_2d
          mpiexec --oversubscribe -n 4 ./build-mpi/pelef_mpi_amr_eb_patch_tree_2d
          mpiexec --oversubscribe -n 8 ./build-mpi/pelef_mpi_amr_eb_patch_tree_2d
      - name: Public sparse MPI arbitrary-depth EB application parity
        run: |
          mpiexec --oversubscribe -n 1 ./build-mpi/pelef_mpi_reactive_eb_patch_tree_2d cases/reactive_eb_patch_tree_2d/hotspot.nml mpi_eb_tree_np1.csv
          mpiexec --oversubscribe -n 2 ./build-mpi/pelef_mpi_reactive_eb_patch_tree_2d cases/reactive_eb_patch_tree_2d/hotspot.nml mpi_eb_tree_np2.csv
          mpiexec --oversubscribe -n 4 ./build-mpi/pelef_mpi_reactive_eb_patch_tree_2d cases/reactive_eb_patch_tree_2d/hotspot.nml mpi_eb_tree_np4.csv
          mpiexec --oversubscribe -n 8 ./build-mpi/pelef_mpi_reactive_eb_patch_tree_2d cases/reactive_eb_patch_tree_2d/hotspot.nml mpi_eb_tree_np8.csv
          python3 tools/compare_mpi_reactive_eb_patch_tree_2d.py mpi_eb_tree_np1.csv mpi_eb_tree_np2.csv mpi_eb_tree_np4.csv mpi_eb_tree_np8.csv
      - name: Public sparse MPI physical-boundary patch-tree parity
        run: |
          mpiexec --oversubscribe -n 1 ./build-mpi/pelef_mpi_reactive_eb_patch_tree_2d cases/reactive_eb_patch_tree_boundary_2d/hotspot.nml mpi_eb_tree_boundary_np1.csv
          mpiexec --oversubscribe -n 2 ./build-mpi/pelef_mpi_reactive_eb_patch_tree_2d cases/reactive_eb_patch_tree_boundary_2d/hotspot.nml mpi_eb_tree_boundary_np2.csv
          mpiexec --oversubscribe -n 4 ./build-mpi/pelef_mpi_reactive_eb_patch_tree_2d cases/reactive_eb_patch_tree_boundary_2d/hotspot.nml mpi_eb_tree_boundary_np4.csv
          mpiexec --oversubscribe -n 8 ./build-mpi/pelef_mpi_reactive_eb_patch_tree_2d cases/reactive_eb_patch_tree_boundary_2d/hotspot.nml mpi_eb_tree_boundary_np8.csv
          python3 tools/check_reactive_eb_patch_tree_2d.py --output mpi_eb_tree_boundary_np1.csv --require-x-upper-boundary --require-branching
          python3 tools/compare_mpi_reactive_eb_patch_tree_2d.py mpi_eb_tree_boundary_np1.csv mpi_eb_tree_boundary_np2.csv mpi_eb_tree_boundary_np4.csv mpi_eb_tree_boundary_np8.csv
      - name: Public sparse MPI EB application cross-rank restart parity
        run: |
          mpiexec --oversubscribe -n 1 ./build-mpi/pelef_mpi_reactive_eb_patch_tree_2d cases/reactive_eb_patch_tree_restart_2d/reference.nml mpi_eb_tree_restart_reference.csv | tee mpi_eb_tree_restart_reference.log
          mpiexec --oversubscribe -n 2 ./build-mpi/pelef_mpi_reactive_eb_patch_tree_2d cases/reactive_eb_patch_tree_restart_2d/checkpoint_stop.nml mpi_eb_tree_restart_stopped.csv
          if mpiexec --oversubscribe -n 4 ./build-mpi/pelef_mpi_reactive_eb_patch_tree_2d cases/reactive_eb_patch_tree_restart_2d/incompatible_restart.nml mpi_eb_tree_restart_incompatible.csv; then
            echo "incompatible checkpoint fingerprint was accepted"
            exit 1
          fi
          mpiexec --oversubscribe -n 4 ./build-mpi/pelef_mpi_reactive_eb_patch_tree_2d cases/reactive_eb_patch_tree_restart_2d/restart.nml mpi_eb_tree_restarted_np4.csv | tee mpi_eb_tree_restarted_np4.log
          mpiexec --oversubscribe -n 8 ./build-mpi/pelef_mpi_reactive_eb_patch_tree_2d cases/reactive_eb_patch_tree_restart_2d/restart.nml mpi_eb_tree_restarted_np8.csv | tee mpi_eb_tree_restarted_np8.log
          python3 tools/check_reactive_eb_patch_tree_restart_2d.py --checkpoint patch_tree_restart.chk --reference mpi_eb_tree_restart_reference.csv --stopped mpi_eb_tree_restart_stopped.csv --restarted mpi_eb_tree_restarted_np4.csv mpi_eb_tree_restarted_np8.csv --reference-log mpi_eb_tree_restart_reference.log --restarted-logs mpi_eb_tree_restarted_np4.log mpi_eb_tree_restarted_np8.log
      - name: Euler rank-count field parity
        run: |
          mpiexec --oversubscribe -n 1 ./build-mpi/pelef_mpi_1d mpi_np1.csv
          mpiexec --oversubscribe -n 2 ./build-mpi/pelef_mpi_1d mpi_np2.csv
          mpiexec --oversubscribe -n 4 ./build-mpi/pelef_mpi_1d mpi_np4.csv
          mpiexec --oversubscribe -n 8 ./build-mpi/pelef_mpi_1d mpi_np8.csv
          python3 tools/compare_mpi_entropy.py mpi_np1.csv mpi_np2.csv mpi_np4.csv mpi_np8.csv
      - name: Multispecies rank-count field parity
        run: |
          mpiexec --oversubscribe -n 1 ./build-mpi/pelef_mpi_multispecies_1d mpi_ms_np1.csv
          mpiexec --oversubscribe -n 2 ./build-mpi/pelef_mpi_multispecies_1d mpi_ms_np2.csv
          mpiexec --oversubscribe -n 4 ./build-mpi/pelef_mpi_multispecies_1d mpi_ms_np4.csv
          mpiexec --oversubscribe -n 8 ./build-mpi/pelef_mpi_multispecies_1d mpi_ms_np8.csv
          python3 tools/compare_mpi_multispecies.py mpi_ms_np1.csv mpi_ms_np2.csv mpi_ms_np4.csv mpi_ms_np8.csv
      - name: Full H2O2 implicit chemistry scheduling parity
        run: |
          mpiexec --oversubscribe -n 1 ./build-mpi/pelef_mpi_h2o2_batch mpi_chem_np1.csv
          mpiexec --oversubscribe -n 2 ./build-mpi/pelef_mpi_h2o2_batch mpi_chem_np2.csv
          mpiexec --oversubscribe -n 4 ./build-mpi/pelef_mpi_h2o2_batch mpi_chem_np4.csv
          mpiexec --oversubscribe -n 8 ./build-mpi/pelef_mpi_h2o2_batch mpi_chem_np8.csv
          python3 tools/compare_mpi_h2o2_batch.py mpi_chem_np1.csv mpi_chem_np2.csv mpi_chem_np4.csv mpi_chem_np8.csv
      - name: General-EOS molecular transport rank-count parity
        run: |
          mpiexec --oversubscribe -n 1 ./build-mpi/pelef_mpi_reactive_transport_1d mpi_transport_np1.csv
          mpiexec --oversubscribe -n 2 ./build-mpi/pelef_mpi_reactive_transport_1d mpi_transport_np2.csv
          mpiexec --oversubscribe -n 4 ./build-mpi/pelef_mpi_reactive_transport_1d mpi_transport_np4.csv
          mpiexec --oversubscribe -n 8 ./build-mpi/pelef_mpi_reactive_transport_1d mpi_transport_np8.csv
          python3 tools/compare_mpi_reactive_transport.py mpi_transport_np1.csv mpi_transport_np2.csv mpi_transport_np4.csv mpi_transport_np8.csv
      - name: Coupled general-EOS reactive rank-count parity
        run: |
          mpiexec --oversubscribe -n 1 ./build-mpi/pelef_mpi_reactive_1d mpi_reactive_np1.csv
          mpiexec --oversubscribe -n 2 ./build-mpi/pelef_mpi_reactive_1d mpi_reactive_np2.csv
          mpiexec --oversubscribe -n 4 ./build-mpi/pelef_mpi_reactive_1d mpi_reactive_np4.csv
          mpiexec --oversubscribe -n 8 ./build-mpi/pelef_mpi_reactive_1d mpi_reactive_np8.csv
          python3 tools/compare_mpi_reactive_1d.py mpi_reactive_np1.csv mpi_reactive_np2.csv mpi_reactive_np4.csv mpi_reactive_np8.csv
      - name: Selected-mechanism coupled MPI rank and fixed parity
        run: |
          mpiexec --oversubscribe -n 1 ./build-mpi/pelef_mpi_reactive_1d_selected mpi_selected_np1.csv
          mpiexec --oversubscribe -n 2 ./build-mpi/pelef_mpi_reactive_1d_selected mpi_selected_np2.csv
          mpiexec --oversubscribe -n 4 ./build-mpi/pelef_mpi_reactive_1d_selected mpi_selected_np4.csv
          python3 tools/compare_mpi_reactive_1d.py mpi_reactive_np1.csv mpi_selected_np1.csv mpi_selected_np2.csv mpi_selected_np4.csv
      - name: Public sparse MPI AMR driver rank-count parity
        run: |
          mpiexec --oversubscribe -n 1 ./build-mpi/pelef_mpi_amr_reactive_1d cases/mpi_sparse_amr_hotspot/hotspot.nml mpi_sparse_amr_np1.csv
          mpiexec --oversubscribe -n 2 ./build-mpi/pelef_mpi_amr_reactive_1d cases/mpi_sparse_amr_hotspot/hotspot.nml mpi_sparse_amr_np2.csv
          mpiexec --oversubscribe -n 4 ./build-mpi/pelef_mpi_amr_reactive_1d cases/mpi_sparse_amr_hotspot/hotspot.nml mpi_sparse_amr_np4.csv
          mpiexec --oversubscribe -n 8 ./build-mpi/pelef_mpi_amr_reactive_1d cases/mpi_sparse_amr_hotspot/hotspot.nml mpi_sparse_amr_np8.csv
          python3 tools/compare_mpi_sparse_amr_1d.py mpi_sparse_amr_np1.csv mpi_sparse_amr_np2.csv mpi_sparse_amr_np4.csv mpi_sparse_amr_np8.csv
      - name: Sparse MPI AMR checkpoint restart rank redistribution
        run: |
          mpiexec --oversubscribe -n 1 ./build-mpi/pelef_mpi_amr_reactive_1d cases/mpi_sparse_amr_hotspot/restart_reference.nml mpi_sparse_amr_restart_reference.csv
          mpiexec --oversubscribe -n 2 ./build-mpi/pelef_mpi_amr_reactive_1d cases/mpi_sparse_amr_hotspot/checkpoint_stop.nml mpi_sparse_amr_checkpoint_stop.csv
          mpiexec --oversubscribe -n 4 ./build-mpi/pelef_mpi_amr_reactive_1d cases/mpi_sparse_amr_hotspot/restart.nml mpi_sparse_amr_restarted_np4.csv
          mpiexec --oversubscribe -n 8 ./build-mpi/pelef_mpi_amr_reactive_1d cases/mpi_sparse_amr_hotspot/restart.nml mpi_sparse_amr_restarted_np8.csv
          python3 tools/compare_mpi_sparse_amr_restart.py mpi_sparse_amr_restart.chk mpi_sparse_amr_restart_reference.csv mpi_sparse_amr_restarted_np4.csv mpi_sparse_amr_restarted_np8.csv
      - name: Distributed 3D AMR serial and rank-count exact parity
        run: |
          ./build-mpi/pelef_amr_reactive_3d cases/amr_reactive_3d/amr_entropy_wave.nml
          mpiexec --oversubscribe -n 1 ./build-mpi/pelef_mpi_amr_reactive_3d cases/amr_reactive_3d/amr_entropy_wave.nml mpi_amr_3d_np1
          mpiexec --oversubscribe -n 2 ./build-mpi/pelef_mpi_amr_reactive_3d cases/amr_reactive_3d/amr_entropy_wave.nml mpi_amr_3d_np2
          mpiexec --oversubscribe -n 4 ./build-mpi/pelef_mpi_amr_reactive_3d cases/amr_reactive_3d/amr_entropy_wave.nml mpi_amr_3d_np4
          mpiexec --oversubscribe -n 8 ./build-mpi/pelef_mpi_amr_reactive_3d cases/amr_reactive_3d/amr_entropy_wave.nml mpi_amr_3d_np8
          python3 tools/check_amr_reactive_3d.py --coarse mpi_amr_3d_np1_coarse.csv --fine mpi_amr_3d_np1_fine.csv --nx 8 --ny 8 --nz 8 --i-lower 3 --i-upper 6 --j-lower 3 --j-upper 6 --k-lower 3 --k-upper 6 --ratio 2 --time 1.0e-6
          python3 tools/compare_mpi_amr_reactive_3d.py --reference-prefix amr_reactive_3d --candidate-prefix mpi_amr_3d_np1 --candidate-prefix mpi_amr_3d_np2 --candidate-prefix mpi_amr_3d_np4 --candidate-prefix mpi_amr_3d_np8
      - name: Distributed 3D AMR changed-rank checkpoint restart
        run: |
          mpiexec --oversubscribe -n 2 ./build-mpi/pelef_mpi_amr_reactive_3d cases/amr_reactive_3d/amr_entropy_wave_checkpoint.nml mpi_amr_3d_checkpoint_np2
          mpiexec --oversubscribe -n 4 ./build-mpi/pelef_mpi_amr_reactive_3d cases/amr_reactive_3d/amr_entropy_wave_restart.nml mpi_amr_3d_restart_np4
          mpiexec --oversubscribe -n 8 ./build-mpi/pelef_mpi_amr_reactive_3d cases/amr_reactive_3d/amr_entropy_wave_restart.nml mpi_amr_3d_restart_np8
          python3 tools/compare_mpi_amr_reactive_3d.py --reference-prefix amr_reactive_3d --candidate-prefix mpi_amr_3d_restart_np4 --candidate-prefix mpi_amr_3d_restart_np8 --checkpoint amr_reactive_3d.chk --final-time 1.0e-6
      - name: Preserve serial regressions
        run: ctest --test-dir build-mpi --output-on-failure -j 2

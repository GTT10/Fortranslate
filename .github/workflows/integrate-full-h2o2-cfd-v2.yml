name: Integrate full H2O2 CFD v2

on:
  push:
    branches:
      - agent/tmp-integrate-full-h2o2-cfd-v2

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch source branches
        run: |
          git fetch origin agent/reactive-physical-boundaries agent/third-body-troe-stiff
          test "$(git rev-parse origin/agent/reactive-physical-boundaries)" = "e06289a500660d3aed79c5ba810a3eb40055382d"
      - name: Reconstruct and verify chemistry core
        shell: bash
        run: |
          rm -rf /tmp/pelef019 /tmp/third
          git worktree add --detach /tmp/pelef019 origin/agent/reactive-physical-boundaries
          mkdir -p /tmp/third
          git archive origin/agent/third-body-troe-stiff | tar -x -C /tmp/third
          python3 - <<'PY'
          from pathlib import Path
          import shutil, re
          dst=Path('/tmp/pelef019'); src=Path('/tmp/third')
          copy_paths=[
            'mechanisms/h2o2_full.json','src/generated/h2o2_full_mechanism_mod.F90',
            'src/physics/h2o2_full_thermo_mod.F90','src/driver/simulation_config_h2o2_full_mod.F90',
            'app/pelef0d_h2o2_full.F90','cases/zero_d_h2o2_full',
            'tests/unit/test_full_h2o2_jacobian.F90','tests/unit/test_implicit_h2o2_reactor.F90',
            'tests/unit/test_pressure_dependent_kinetics.F90','tools/check_zero_d_h2o2_full.py',
            'tools/compare_h2o2_full_cantera.py','tools/generate_elementary_mechanism.py',
            'src/chemistry/elementary_kinetics_mod.F90','src/chemistry/constant_volume_reactor_mod.F90']
          for rel in copy_paths:
              s=src/rel; d=dst/rel
              if not s.exists(): continue
              if d.exists(): shutil.rmtree(d) if d.is_dir() else d.unlink()
              d.parent.mkdir(parents=True,exist_ok=True)
              shutil.copytree(s,d) if s.is_dir() else shutil.copy2(s,d)
          cm=(dst/'CMakeLists.txt').read_text()
          cm=re.sub(r'VERSION\s+0\.18\.0','VERSION 0.19.0',cm,count=1)
          def add_after(text,anchor,line): return text if line.strip() in text else text.replace(anchor,anchor+'\n  '+line,1)
          cm=add_after(cm,'  src/physics/thermo_database_mod.F90','src/physics/h2o2_full_thermo_mod.F90')
          cm=add_after(cm,'  src/generated/h2o2_elementary_mechanism_mod.F90','src/generated/h2o2_full_mechanism_mod.F90')
          cm=add_after(cm,'  src/driver/simulation_config_h2o2_reactor_mod.F90','src/driver/simulation_config_h2o2_full_mod.F90')
          if 'add_executable(pelef0d_h2o2_full' not in cm:
              a='add_executable(pelef0d_h2o2 app/pelef0d_h2o2.F90)'
              cm=cm.replace(a,a+'\nadd_executable(pelef0d_h2o2_full app/pelef0d_h2o2_full.F90)\ntarget_link_libraries(pelef0d_h2o2_full PRIVATE pelef_core)',1)
          (dst/'CMakeLists.txt').write_text(cm)
          PY
          cmake -S /tmp/pelef019 -B /tmp/pelef019/build -DCMAKE_BUILD_TYPE=Release -DPELEF_ENABLE_TESTS=ON
          cmake --build /tmp/pelef019/build --parallel 2
          ctest --test-dir /tmp/pelef019/build --output-on-failure -j 2
      - name: Publish only after all gates pass
        run: |
          cd /tmp/pelef019
          rm -rf build
          git add -- CMakeLists.txt app cases mechanisms src tests tools docs
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git commit -m "Add pressure-dependent full H2O2 chemistry core"
          git push origin HEAD:agent/reactive-full-h2o2-cfd

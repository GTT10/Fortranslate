name: Apply verified PeleF 0.19.0

on:
  push:
    branches:
      - agent/tmp-publish-full-h2o2-cfd-v2
  pull_request:
    branches:
      - agent/reactive-physical-boundaries

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out payload branch
        uses: actions/checkout@v4
        with:
          ref: agent/tmp-publish-full-h2o2-cfd-v2
          fetch-depth: 0

      - name: Decode and verify patch
        shell: bash
        run: |
          cat \
            tools/pelef019.chunk00 \
            tools/pelef019.chunk01 \
            tools/pelef019.chunk02 \
            tools/pelef019.chunk03 \
            tools/pelef019.chunk04 \
            | base64 --decode > /tmp/pelef019.patch.gz
          echo "f54345a2624bfded8cbad9b7a664560633586670a6e7612b8efe11cad9f4badd  /tmp/pelef019.patch.gz" \
            | sha256sum --check --strict
          gzip -dc /tmp/pelef019.patch.gz > /tmp/pelef019.patch
          echo "48ee632ce5998098d0d228615c013c8682366cad92ed38930472040e0281238f  /tmp/pelef019.patch" \
            | sha256sum --check --strict

      - name: Apply and publish implementation
        shell: bash
        run: |
          git fetch origin agent/reactive-full-h2o2-cfd
          git switch --force-create agent/reactive-full-h2o2-cfd \
            origin/agent/reactive-full-h2o2-cfd
          test "$(git rev-parse HEAD)" = "e06289a500660d3aed79c5ba810a3eb40055382d"
          git config user.name "Toshiki Kakeya"
          git config user.email "pqg693x1@s.okayama-u.ac.jp"
          git apply --index /tmp/pelef019.patch
          git diff --cached --check
          git commit -m "Add full pressure-dependent H2O2 chemistry to reactive CFD"
          test "$(git rev-parse HEAD^{tree})" = \
            "b1e5c36318f94bd6a38a13b79c42a3f3ab0f1af4"
          git push origin HEAD:agent/reactive-full-h2o2-cfd
